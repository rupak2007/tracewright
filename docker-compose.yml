# Tracewright stack (architecture §18). `ollama` (profile `llm`) is optional and off by default.
# Trust boundary: untrusted capture bytes are parsed only in `worker`, which sits on an
# `internal: true` network (no egress) with a read-only filesystem and no capabilities.

networks:
  internal:
    internal: true
  edge: {}

volumes:
  pgdata: {}
  uploads: {}
  artifacts: {}
  ollama: {}

services:
  db:
    image: postgres:16.15@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
    networks: [internal]
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}  # recorded in each run manifest; empty when not set
    networks: [internal] # no egress
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 6g
    cpus: 4
    pids_limit: 256
    volumes:
      - uploads:/data/uploads:ro
      - artifacts:/data/artifacts
      - ./config:/config:ro
      - ./knowledge:/knowledge:ro
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy  # the API container applies the migrations first
    restart: on-failure

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    networks: [internal, edge]
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - uploads:/data/uploads
      - artifacts:/data/artifacts:ro
      - ./config:/config:ro
      - ./knowledge:/knowledge:ro
    environment:
      CONFIG_DIR: /config
      KNOWLEDGE_DIR: /knowledge
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure

  web:
    build:
      context: ./frontend
    networks: [edge]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure

  # Optional local model for the narrative (gate G2 is not run: see eval/decisions/G2.md). Start it
  # with `--profile llm` and set LLM_PROVIDER=ollama, LLM_MODEL, LLM_BASE_URL=http://ollama:11434.
  # It sits on the internal network only (no egress), so the model must be put into the `ollama`
  # volume beforehand (docs/architecture.md section 13). It only ever sees the pseudonymised pack.
  ollama:
    profiles: [llm]
    image: ollama/ollama:0.40.1@sha256:69f27594d8127cb43db1edcafa5e2d3cd8f88bdbc54a2cf3ceb11b8d138a24b1
    networks: [internal]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
