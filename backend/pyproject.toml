[project]
name = "tracewright"
version = "0.1.0"
description = "Offline network incident investigation: PCAP -> Zeek -> detectors -> evidence-backed incidents."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pandas>=2.2",
    "pyarrow>=18",
    "pyyaml>=6.0",
    "tldextract>=5.4.0",
    "jinja2>=3.1.6",
    "scikit-learn>=1.9.1",
    "alembic>=1.20.0",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "pre-commit>=4.0",
    "scapy>=2.6",
    "pandas-stubs",
    "types-pyyaml",
]

[project.scripts]
tracewright = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "../lab", "../eval"]
mypy_path = ".."
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true  # pyarrow and scikit-learn ship no type stubs

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["requires_zeek: needs the real zeek/capinfos binaries (run in the worker image)"]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing"
