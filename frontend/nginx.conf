# Static UI + same-origin proxy to the API. Unprivileged (listens on 8080), read-only root FS.
# CSP: scripts and styles only from this origin; the UI never loads anything external (offline tool).
pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    location /api/ {
      include /etc/nginx/security-headers.conf;
      proxy_pass http://api:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_request_buffering off;   # stream uploads straight to the API (size cap is enforced there)
      client_max_body_size 520m;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    location /assets/ {
      expires 1y;
      include /etc/nginx/security-headers.conf;  # add_header in a location drops inherited ones
      add_header Cache-Control "public, immutable";
    }

    location / {
      try_files $uri /index.html;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store";
    }
  }
}
