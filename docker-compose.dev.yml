# Dev override: mounts source for reload and publishes the API on loopback only (SEC-07).
# Security settings from docker-compose.yml are intentionally NOT relaxed here.
# The db service has no published port: it lives on an `internal: true` network.
# Use `docker compose exec db psql -U "$POSTGRES_USER" "$POSTGRES_DB"` for a shell.

services:
  api:
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/app:/app/app:ro

  worker:
    volumes:
      - ./backend/app:/app/app:ro
